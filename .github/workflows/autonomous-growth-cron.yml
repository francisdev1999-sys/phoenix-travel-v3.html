name: Autonomous Growth Cron

# Drives the discovery -> promotion -> auto-approve pipeline on a schedule.
# Railway has no native cron configured for this project, so this workflow
# is the only thing that calls /api/cron/* in production. Requires a
# repository secret CRON_SECRET matching the value set in Railway's env vars.

on:
  schedule:
    - cron: '*/5 * * * *'        # process-jobs          — every 5 min
    - cron: '*/15 * * * *'       # lift-bans            — every 15 min
    - cron: '0 * * * *'          # news-feed             — hourly
    - cron: '5 5 */5 * *'        # node-discovery         — every 5 days
    - cron: '20 5 */5 * *'       # source-discovery       — every 5 days
    - cron: '35 0,6,12,18 * * *' # auto-similarity        — every 6h
    - cron: '0 2 * * *'          # auto-relationships     — daily 02:00 UTC
    - cron: '0 3 * * *'          # research-maturity      — daily 03:00 UTC
    - cron: '0 4 * * *'          # auto-audit             — daily 04:00 UTC
    - cron: '30 4 * * *'         # fix-invalid-dates      — daily 04:30 UTC
    - cron: '0 5 * * *'          # learning-pass          — daily 05:00 UTC
    - cron: '45 5 * * *'         # news-discovery         — daily 05:45 UTC
    - cron: '0 0 1 * *'          # trust-pass             — monthly
  workflow_dispatch:
    inputs:
      job:
        description: Cron job to trigger manually
        required: true
        type: choice
        options:
          - process-jobs
          - lift-bans
          - news-feed
          - node-discovery
          - source-discovery
          - auto-similarity
          - auto-relationships
          - research-maturity
          - auto-audit
          - fix-invalid-dates
          - learning-pass
          - news-discovery
          - trust-pass

jobs:
  trigger:
    name: Trigger cron endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Resolve job name
        id: resolve
        env:
          SCHEDULE:   ${{ github.event.schedule }}
          MANUAL_JOB: ${{ github.event.inputs.job }}
        run: |
          if [ -n "$MANUAL_JOB" ]; then
            job="$MANUAL_JOB"
          else
            case "$SCHEDULE" in
              '*/5 * * * *')         job='process-jobs' ;;
              '*/15 * * * *')        job='lift-bans' ;;
              '0 * * * *')           job='news-feed' ;;
              '5 5 */5 * *')         job='node-discovery' ;;
              '20 5 */5 * *')        job='source-discovery' ;;
              '35 0,6,12,18 * * *')  job='auto-similarity' ;;
              '0 2 * * *')           job='auto-relationships' ;;
              '0 3 * * *')           job='research-maturity' ;;
              '0 4 * * *')           job='auto-audit' ;;
              '30 4 * * *')          job='fix-invalid-dates' ;;
              '0 5 * * *')           job='learning-pass' ;;
              '45 5 * * *')          job='news-discovery' ;;
              '0 0 1 * *')           job='trust-pass' ;;
              *) echo "Unrecognized schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Call cron endpoint
        env:
          JOB:          ${{ steps.resolve.outputs.job }}
          CRON_SECRET:  ${{ secrets.CRON_SECRET }}
          SITE_URL:     ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set — cannot authenticate." >&2
            exit 1
          fi
          url="${SITE_URL:-https://nexusarchive.up.railway.app}/api/cron/${JOB}"
          # Retry transient failures (network errors / 5xx) with backoff.
          # 4xx means auth/config — retrying won't help, fail immediately.
          for attempt in 1 2 3; do
            status=$(curl -sS -o /tmp/response.json -w '%{http_code}' -X POST "$url" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --max-time 290 \
              -d '{}') || status=0
            echo "Attempt $attempt — HTTP status: $status"
            cat /tmp/response.json 2>/dev/null
            echo
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              exit 0
            fi
            if [ "$status" -ge 400 ] && [ "$status" -lt 500 ]; then
              echo "Cron job '$JOB' failed with client error $status — not retrying." >&2
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Cron job '$JOB' failed after 3 attempts (last status $status)" >&2
          exit 1

  # GitHub disables scheduled workflows after ~60 days without repository
  # activity. Hitting the workflow "enable" API resets that timer, keeping the
  # autonomous pipeline alive indefinitely. Runs on the monthly schedule.
  keepalive:
    name: Keep scheduled workflows alive
    if: github.event.schedule == '0 0 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day scheduled-workflow timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/autonomous-growth-cron.yml/enable"
          echo "Keepalive OK — schedule disable timer reset."
