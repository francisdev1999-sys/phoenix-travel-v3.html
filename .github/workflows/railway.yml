name: CI → Deploy to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy values — build doesn't connect to DB or auth providers.
          # Prisma generate (part of build) only needs the schema, not a live DB.
          DATABASE_URL:       "postgresql://ci:ci@localhost:5432/ci"
          AUTH_SECRET:        ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID:     "ci"
          AUTH_GOOGLE_SECRET: "ci"
          AUTH_URL:           "http://localhost:3000"
          ADMIN_EMAIL:        "ci@ci.com"
          NEXTAUTH_URL:       "http://localhost:3000"

  deploy:
    name: Deploy
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy and wait
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
